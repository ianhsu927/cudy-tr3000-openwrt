name: Build Cudy TR3000 v1 OpenWrt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config.seed', 'scripts/**', '.github/workflows/build.yml']
  schedule:
    - cron: '0 20 * * 5'
permissions:
  contents: write
concurrency:
  group: tr3000-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl libelf-dev time
          df -h
      - name: Prepare TR3000 and packages
        run: bash scripts/prepare.sh
      - name: Download sources
        working-directory: openwrt
        run: make download -j4
      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j2 2>&1 | tee ../output/build.log || make -j1 V=s 2>&1 | tee -a ../output/build.log
      - name: Verify and collect TR3000 firmware
        run: bash scripts/collect.sh
      - name: Upload firmware and diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3000-v1-128mb-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish successful firmware release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="tr3000-v1-build-${RUN_ID}"
          test -n "$(find output -maxdepth 1 -name '*-cudy_tr3000-v1-squashfs-sysupgrade.bin' -print -quit)"
          test -s output/sha256sums
          test -s output/matching-packages.tar.gz
          gh release create "$tag" \
            output/*-cudy_tr3000-v1-squashfs-sysupgrade.bin \
            output/*-cudy_tr3000-v1.manifest \
            output/profiles.json \
            output/sha256sums \
            output/matching-packages.tar.gz \
            --target "$COMMIT_SHA" \
            --title "TR3000 v1 OpenWrt build #${RUN_NUMBER}" \
            --notes "Automated OpenWrt 25.12 build for Cudy TR3000 v1 (stock 128MB layout). Commit: ${COMMIT_SHA}. Actions run: https://github.com/${GH_REPO}/actions/runs/${RUN_ID}. Verify checksums and device layout before flashing."
